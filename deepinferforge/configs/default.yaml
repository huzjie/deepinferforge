# deepinferforge default configuration
# Declared scale (671B MoE / NVIDIA + Ascend dual targets) is informational only;
# the reference instantiates tiny tensors.

app:
  name: deepinferforge
  version: 1.0.0

ir:
  default_dtype: float32
  name: graph

backend:
  default_backend: nvidia
  targets: [nvidia, ascend]

passes:
  fusion: true
  constfold: true
  dce: true
  memory_plan: true
  canonicalize: true

autotune:
  max_trials: 32
  strategy: grid
  tile_candidates: [8, 16, 32, 64]

quant:
  scheme: int8
  group_size: 128
  symmetric: true

model:
  dim: 32
  n_layers: 4
  n_heads: 4
  head_dim: 8
  vocab: 128
  seq_len: 16
  n_experts: 8
  top_k: 2
  declared_params_b: 671.0
  declared_active_b: 37.0

runtime:
  pool_bytes: 1048576
  max_streams: 4

scheduler:
  hbm_bytes: 1073741824
  host_bytes: 8589934592
  hot_fraction: 0.8
  prefetch_depth: 2

speculative:
  draft_len: 4
  cost_ratio: 0.2
  acceptance_base: 0.3

serving:
  host: 127.0.0.1
  port: 8421

train:
  learning_rate: 0.3
  max_steps: 24
  seed: 20261026

bench:
  n_tasks: 256
  seed: 20261026

declared:
  project: DeepInfer
  vendor: DeepSeek
  announcement: 2026-10-26
  dual_target: NVIDIA (CUDA) + Huawei Ascend (CANN)
  model_params_b: 671.0
  model_active_b: 37.0
  license: open source
