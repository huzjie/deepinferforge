apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deepinferforge.fullname" . }}
  labels:
    app: {{ include "deepinferforge.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "deepinferforge.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "deepinferforge.name" . }}
    spec:
      containers:
        - name: deepinferforge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
